# Core Hugo settings. Developer-only: CloudCannon editors never see this file.
# Theme options live in params.toml, site title and author in languages.en.toml,
# menus in menus.en.toml.

baseURL = "https://example.com/"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0
buildDrafts = false
buildFuture = false
enableEmoji = true

[pagination]
  pagerSize = 20

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "series"
    weight = 50
  [[related.indices]]
    name = "date"
    weight = 10

# CloudCannon Visual Editor: make the theme's icons readable by the editor's in-browser Hugo
# (see layouts/partials/icon.html).
[params.editable_regions.additional_dirs]
  "_vendor/github.com/nunocoracao/blowfish/v3/assets/icons" = [".svg"]
